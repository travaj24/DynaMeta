name: CI

# WHAT EACH LEG ACTUALLY INSTALLS AND RUNS. Audit T-2/T-3/T-4/T-5: the previous version of this
# file carried a comment asserting the py3.10-3.12 legs resolved numpy 1.x -- no leg ever did, and
# the floor it claimed to defend (`numpy>=1.24`) was therefore installed nowhere. Keep this table
# true or delete it; a false comment is worse than no comment.
#
#   job      runs-on py   installs                            runs                          added cost
#   -------- ------- ---- ----------------------------------- ----------------------------- ----------
#   test     ubuntu  3.10 core+dev+plot+h5py, FLOATING resolve fast suite                     unchanged
#   test     ubuntu  3.11   (every leg lands on the NEWEST     fast suite                     unchanged
#   test     ubuntu  3.12    numpy 2.x -- `numpy>=1.24` is an  fast suite + coverage          + cov overhead
#   test     ubuntu  3.13    open floor), +zarr(3.11+) +jax    fast suite + smoke tier        unchanged
#   floor    ubuntu  3.10 the OLDEST DECLARED pins             import sweep + fast suite      1 suite / ncores
#                                                              (`-n auto`, the WHOLE suite,    (xdist)
#                                                              no per-file exclusions; one
#                                                              module self-skips on numpy 1.x)
#   numba    windows 3.12 core+dev+[numba]                     16 numba tests + parity oracle ~8 min
#   lint     ubuntu  3.12 ruff only (no science stack)         ruff check .                   <1 min
#   solvers  ubuntu  3.12 core+dev+plot+[solvers]              22 FEM/DEVSIM modules + 3 FEM  ~10 min
#                                                              validation oracles
#   nightly  ubuntu  3.12 core+dev+plot+[solvers]              @slow set + the 3 heavy FEM     hours
#            SCHEDULE +       +h5py/zarr/jax                   modules + the 4 heavy FEM       (never
#            DISPATCH ONLY                                     oracles + full validation tier   on PRs)
#
# The "added cost" figures for the PR legs are measured (2026-07-26, this repo, 2 threads per
# process); the four `test` legs are untouched apart from coverage on 3.12. The `nightly` figure is
# an ESTIMATE assembled from per-item measurements -- that job's own comment states exactly which
# of its numbers are measured and which are not.
#
# Not covered by ANY leg (stated so the next audit does not have to rediscover it): CUDA kernels,
# the [materials-db] extra, macOS, tests/test_bic_capstone.py under numpy 1.x (it does not
# finish there; the file skips itself -- see its guard), and the rectangular-cell grating
# parametrization test_spol_suppressed_vs_ppol[2.7e-07-1.9e-07] (63.8 GB peak working set --
# exceeds every hosted runner; deselected in nightly step (b2), covered on the dev workstation
# only). The heavy FEM modules and the @slow validation wrappers came OFF this list when the
# `nightly` job landed -- it runs both.

on:
  push:
    branches: [main]
  pull_request:
  # The nightly tier's triggers. What adding them here does and does NOT do:
  #   * `schedule` and `workflow_dispatch` are WORKFLOW-level -- GitHub has no per-job trigger --
  #     so every OTHER job in this file also fires on the cron and on a manual dispatch. That is
  #     left deliberately: the four `test` legs float their resolve, so a nightly re-run is a
  #     canary for a freshly released numpy/scipy/lumenairy breaking us with no PR in flight. The
  #     direction that needed enforcing is the reverse one, and it IS enforced -- the `nightly`
  #     job below carries an `if:` so the 2-3 h tier never runs on a push or a pull_request.
  #   * `schedule` only ever runs on the DEFAULT branch: until this file lands on main the nightly
  #     job is reachable by workflow_dispatch only, and it cannot be exercised from a branch.
  #   * GitHub disables scheduled workflows after 60 days with no repository activity.
  # 07:17 UTC (~02:17 America/Chicago), off the top of the hour on purpose: scheduled runs queue
  # behind everybody else's `0 * * * *` and are routinely delayed by tens of minutes there.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # audit T-14: every job carries an explicit cap. GitHub's silent default is 6 h, and
    # run_all's own per-script cap is 1800 s x 93 smoke scripts, so "hung job" used to mean
    # "burn the day". These are CAPS, not budgets -- see the table at the top. 75 rather than 60
    # because the 3.12 leg now also carries coverage instrumentation.
    # (audit X-19/X-26 added 9 measured solver-free scripts to the tier, ~112 s of real work --
    # the 7 curated bridge/capstone gates plus 2 new material/pole-finder wrappers.)
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # All four legs resolve the NEWEST numpy (2.x) -- an open `>=` floor always does. This
        # matrix is therefore the numpy-2.x compatibility surface (a re-introduced np.trapz /
        # np.float_ fails here); the OTHER direction -- a numpy-2-only API used under the
        # declared 1.24 floor, i.e. audit X-1 -- is caught by the `floor` job below, not here.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install core + dev + plot (matplotlib) and h5py directly so the results/IO/viz/
      # cache layer is exercised on every Python. NOTE: the `io` extra pins zarr>=3.0,
      # which requires Python >=3.11 -- installing it would break the py3.10 leg, so we
      # install h5py here (wheels on all CI Pythons) and let the IDENTICAL zarr code path
      # be covered locally on 3.11+; the io tests pick whichever backend is installed and
      # skip the rest. The heavy solver stack (devsim/ngsolve/gmsh) is NOT exercised here
      # -- the `solvers` job is where it is.
      - name: Install (core + dev + plot + h5py)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot]" "h5py>=3.8" "zarr>=3; python_version >= '3.11'" "jax>=0.11; python_version >= '3.12'"
      - name: Run fast tests
        # audit S6-3: the @slow tests (now 9 -- 8 in test_soa.py, 1 in test_harmonics.py) are
        # excluded from all four legs; seven are wrappers whose underlying validation modules run
        # once in the py3.13 smoke tier, and ALL NINE run in the `nightly` job, step (a).
        if: matrix.python-version != '3.12'
        run: pytest tests/ -q -m "not slow"
      # audit T-4: pytest-cov was installed on every leg and invoked on none, so the coverage
      # number quoted in the audit had no gate behind it. ONE leg measures it (running the suite
      # twice on 3.12 would just buy wall-clock). The floor is set BELOW the measured value on
      # purpose: it is a ratchet against a large regression, not a target to tune tests to.
      - name: Run fast tests + coverage
        if: matrix.python-version == '3.12'
        run: pytest tests/ -q -m "not slow" --cov=dynameta --cov-report=term --cov-fail-under=65
      # audit 1.2/6.3: the smoke validation tier was advertised 'CI-able' but never
      # wired in -- its physics oracles gated nothing automatically. One leg (the
      # numpy-2.x python) runs the curated pure-numpy tier. audit T-3: a smoke-tier
      # capability-skip (exit 42) is now a FAILURE unless declared with --allow-skip;
      # qd_soa_numba_parity is declared here because the `numba` job runs it for real.
      - name: Run smoke validation tier
        if: matrix.python-version == '3.13'
        run: python -m validation.run_all --tier smoke --allow-skip qd_soa_numba_parity

  floor:
    # audit T-2: the ONLY leg that installs the DECLARED dependency floors. Everything else in
    # this file floats to the newest release, so `numpy>=1.24` / `scipy>=1.10` / `lumenairy>=5.22`
    # were assertions no job could falsify. Pin set resolved 2026-07-26 by pip cross-resolve for
    # cp310 (numpy 1.24.4 + scipy 1.10.1 + lumenairy 5.22.0, pulling matplotlib 3.10.9); numpy 1.x
    # has no cp312/cp313 wheels, so py3.10 is the only interpreter this set installs on at all.
    name: floor pins (py3.10, oldest declared)
    runs-on: ubuntu-latest
    # 8:18 wall at -n 8 locally (~66 CPU-min); a 2-vCPU runner should land well inside this cap.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (core pinned to the declared floor)
        # pytest-xdist is a CI-only accelerator, not a declared dependency: this leg re-runs the
        # whole fast suite, and `-n auto` is what keeps a FIFTH full-suite run from doubling the
        # PR wall-clock. The suite was verified xdist-safe locally (an 8-worker run reproduces
        # exactly the serial pass/fail set, both at the floor and at the newest resolve).
        run: |
          python -m pip install --upgrade pip
          pip install -e . "numpy==1.24.*" "scipy==1.10.*" "lumenairy==5.22.*" "pytest>=7.0" tmm pytest-xdist
      - name: Assert the floor is what actually got installed
        # The trip-wire that keeps this leg honest: `np.trapezoid` DOES NOT EXIST before numpy
        # 2.0, so its absence proves this interpreter really is on the pre-2.0 API surface. If a
        # future resolve silently upgrades numpy, this fails instead of quietly re-floating.
        run: |
          python - <<'PY'
          import numpy, scipy, lumenairy
          assert numpy.__version__.startswith("1.24."), numpy.__version__
          assert scipy.__version__.startswith("1.10."), scipy.__version__
          assert lumenairy.__version__.startswith("5.22."), lumenairy.__version__
          assert not hasattr(numpy, "trapezoid"), "numpy is NOT at the declared floor"
          print("floor OK:", numpy.__version__, scipy.__version__, lumenairy.__version__)
          PY
      - name: Import every shipped module at the floor
        # Broader than any test selection and the cheapest possible catch for X-1's class: a
        # numpy-2-only name at module scope in ANY of the ~200 library modules. Optional-backend
        # ImportErrors (ngsolve/devsim/gmsh/numba/jax/zarr/h5py/cupy/tmm/...) are expected here and
        # skipped by name; an AttributeError or any other exception is a real floor break.
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys, traceback
          import dynameta
          OPTIONAL = ("ngsolve", "netgen", "devsim", "gmsh", "numba", "jax", "zarr", "h5py",
                      "cupy", "tmm", "jarvis", "mp_api", "refractiveindex", "matplotlib")
          bad = []
          for m in pkgutil.walk_packages(dynameta.__path__, "dynameta."):
              try:
                  importlib.import_module(m.name)
              except ImportError as e:
                  if any(o in str(e) for o in OPTIONAL):
                      continue
                  bad.append((m.name, repr(e)))
              except Exception as e:
                  bad.append((m.name, repr(e)))
                  traceback.print_exc()
          print("swept", len(list(pkgutil.walk_packages(dynameta.__path__, "dynameta."))), "modules")
          if bad:
              for name, err in bad:
                  print("FLOOR-BREAK", name, err)
              sys.exit(1)
          PY
      - name: Run the fast suite at the floor
        # The WHOLE fast suite -- this leg no longer excludes anything by name.
        # tests/test_bic_capstone.py used to be `--ignore`d here because it does not finish on
        # these pins (>15 min at ~750% CPU before it was killed, vs ~9 s elsewhere). That
        # exclusion now lives INSIDE the file as a numpy-1.x skip guard, which is strictly better
        # in three ways: it states the CONDITION where a workflow line could only state a
        # filename; it reports a visible SKIP with a reason instead of silently collecting
        # nothing; and it travels with the test to anyone who runs the floor pins locally. Read
        # that guard before touching it -- it also carries the measurement that FALSIFIES the
        # original "lumenairy 5.22.0 is the cause" attribution (this same file passes in 8.0-8.8 s
        # with lumenairy 5.22.0 installed, on numpy 2.x), which is why the guard keys on numpy and
        # why the package floor stays `lumenairy>=5.22`.
        # The EIGHT per-test `--deselect` lines that used to sit here were the last of audit X-1:
        # those tests called `np.trapezoid` DIRECTLY, which does not exist before numpy 2.0, so
        # the trap the X-1 fix removed from the library still lived in tests/. All 17 call sites
        # in tests/ and validation/ now route through core.numerics.trapz (the same one home the
        # library uses), the list is gone, and
        # tests/test_numerics.py::test_no_direct_numpy_trapezoid_in_tests_and_validation keeps it
        # gone. Everything runs, so a new floor break anywhere turns this leg red.
        run: pytest tests/ -q -m "not slow" -n auto

  numba:
    # audit T-3: `numba` was declared by no extra and installed by no leg, so 13 library modules /
    # 44 njit-prange kernels, 16 numba-gated tests and the one numba parity oracle ran NOWHERE --
    # and the oracle's exit-42 skip was counted as a non-failure, so the tier read green. Windows
    # on purpose: the TBB threading-layer hard-crash that dynameta/numba_env.py exists to defend
    # against is Windows-specific, and conftest.py runs that probe on every pytest start.
    name: numba kernels (windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        # windows-latest defaults to PowerShell, where a trailing `\` is NOT a line continuation
        # -- the multi-line pytest invocation below would silently run only its first line.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + dev + numba)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,numba]"
      - name: Assert numba is importable and the threading probe runs
        run: |
          python -c "import numba; print('numba', numba.__version__)"
          python -c "from dynameta.numba_env import ensure_working_threading_layer as f; f(); import os; print('NUMBA_THREADING_LAYER=', os.environ.get('NUMBA_THREADING_LAYER'))"
      - name: Run every numba-gated test
        # `-k numba` is exact, not a heuristic: all 16 numba-gated tests in these five modules
        # carry "numba" in the test name, and the deselected remainder is what the ubuntu legs
        # already run without numba. Measured locally 2026-07-26 with numba present:
        # mo_oblique 4 passed / chi2_raman 2 / hot_carrier 3 / soa 6 / soa_generality 1 = 16/16
        # PASS. Running the WHOLE files instead would add ~10 min of numpy-side FDTD time loops
        # that buy nothing here.
        run: |
          pytest -q -m "not slow" -k numba \
            tests/test_fdtd_mo_oblique.py tests/test_fdtd_chi2_raman.py \
            tests/test_fdtd_hot_carrier.py tests/test_soa.py tests/test_soa_generality.py
      - name: Run the numba parity oracle for real
        # ~60 s with numba present (measured). This is the oracle that exited 42 and read green.
        run: python -m validation.run_all --tier smoke qd_soa_numba_parity

  lint:
    # audit T-4: ruff was pinned in [dev] and invoked by no leg while 178 violations accumulated.
    # The enforced surface is pinned in pyproject ([tool.ruff.lint] select = F, E9), not by a ruff
    # version here. dynameta/ is clean and fully gated; tests/ and validation/ have documented
    # per-file-ignores for their pre-existing F401/F841/F811 (see pyproject for why, and shrink it).
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff only
        run: python -m pip install --upgrade pip ruff
      - name: ruff check .
        run: ruff check .

  solvers:
    # audit T-5: no leg installed the [solvers] extra, so ~99 test functions (13 whole modules
    # skipping at import) and 122 of 206 gated validations were structurally unreachable -- the
    # regression class F-1/F-2/F-5/F-23/C-5/C-6 all live in. ngsolve, devsim and gmsh all have
    # manylinux wheels (verified 2026-07-26: ngsolve 6.2.2606 cp310-cp314, devsim 2.10.0 cp39-abi3,
    # gmsh 4.15.2), so this needs no source build -- only libGLU, which gmsh's ctypes load needs.
    # Bounded on purpose: selected modules, not the whole suite.
    name: solvers (ngsolve + devsim, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.12 on purpose: that is the interpreter this leg's install and test selection were
          # verified against locally (ngsolve 6.2.2606 cp312 wheel + devsim 2.10.0 cp39-abi3).
          python-version: "3.12"
      - name: System libs (gmsh needs libGLU; devsim dlopens BLAS/LAPACK)
        # devsim searches DEVSIM_MATH_LIBS="libopenblas.so:liblapack.so:libblas.so" at import
        # and hard-fails without one (first PR-6 CI run: "MISSING DLL" x3 -> RuntimeError).
        # The dev box never sees this because its devsim wheel finds a system BLAS.
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libopenblas-dev liblapack-dev
      - name: Install (core + dev + plot + solvers)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,solvers]"
      - name: Assert the solver stack really imported
        run: python -c "import ngsolve, devsim, gmsh; print('ngsolve', ngsolve.__version__); print('devsim', devsim.__version__); print('gmsh ok')"
      - name: Run the ngsolve/devsim-gated test modules
        # The 25 modules that mention ngsolve or devsim, MINUS the three that dominate the clock
        # (test_fem_drivers > 300 s, test_graded_tensor_fem > 240 s, test_shg_grating -- the heavy
        # grating/driver sweeps; they run in the `nightly` job, steps (b1)/(b2)). Every file
        # listed here was run locally against ngsolve 6.2.2606 + devsim 2.10.0 on 2026-07-26 and
        # passed. ADD NEW SOLVER-GATED MODULES HERE -- an unlisted one silently runs nowhere,
        # which is exactly the T-5 failure mode.
        run: |
          pytest -q -m "not slow" \
            tests/test_audit_2026_07_17_infra.py tests/test_audit_guards.py \
            tests/test_bridge.py tests/test_carrier_heating.py tests/test_carriers_gfactor.py \
            tests/test_contact_current.py tests/test_density_gradient.py \
            tests/test_devsim_smoke.py tests/test_electrothermal.py \
            tests/test_gated_builder.py tests/test_geometry_shapes.py \
            tests/test_hydro_fem.py tests/test_impact_ionization.py \
            tests/test_mesh_periodicity.py tests/test_mobility.py \
            tests/test_pipeline_effects.py tests/test_polarization_vocabulary.py \
            tests/test_qcse.py tests/test_sfg_fem.py \
            tests/test_shg_fem.py tests/test_solver_guards.py \
            tests/test_stacked3d_spec.py tests/test_thermal_twotemp.py
      - name: Run the FEM/DEVSIM validation smoke subset
        # The solver-backed oracles the smoke tier cannot reach at all (run_all's SMOKE set is
        # pure-numpy by construction). These two tokens select THREE scripts -- electrostatics_fem
        # (15 s), thermal_fem (26 s) and, by substring, thermal_fem_twotemp (5 s) -- all measured
        # PASS locally on 2026-07-26 against ngsolve 6.2.2606. It is a deliberately small beachhead:
        # every other FEM oracle probed (superstrate_index_fem, graded_tmm_vs_fem,
        # per_region_absorption, symmetry_reduced_fem) exceeds 180 s each and runs in the `nightly`
        # job instead (step (c1); the whole gated set runs there too, step (c2)). Grow this list
        # with measurements.
        # A capability skip here is informational (this is not the smoke tier), but with the extra
        # installed there should be none: an exit 42 means the install step silently did not take.
        run: python -m validation.run_all electrostatics_fem thermal_fem

  nightly:
    # WHERE THE WORK THE PR LEGS DROPPED ACTUALLY RUNS. Every "too slow for the PR tier" decision
    # in this file (the `solvers` job's three excluded modules, the four FEM oracles it names but
    # does not run, the `test` legs' `-m "not slow"`) was a measurement, not a dismissal -- but
    # until this job existed, "excluded from the PR legs" meant "executed nowhere", which is the
    # exact T-3/T-5 failure mode the audit was about. This tier closes that.
    #
    # NOT REACHABLE FROM A PULL REQUEST. `schedule:`/`workflow_dispatch:` are workflow-level
    # triggers (GitHub has no per-job trigger), so this `if:` is the whole mechanism keeping a
    # multi-hour job off the PR path. Do not delete it.
    name: nightly (slow suite + heavy FEM + full validation tier)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # WHAT THIS CAP IS BUILT FROM, per step. MEASURED = run on the dev workstation 2026-07-26
    # (py3.14, ngsolve 6.2.2604 + devsim 2.10.0, each file run on its own, serially). That box has
    # far more cores and RAM than a GitHub-hosted runner (4 vCPU / 16 GB), so every local number
    # below is a FLOOR for the CI wall, not a forecast:
    #   (a) pytest -m slow          9 tests    736 s MEASURED (test_soa.py 719 s -- the Innolume
    #                                          co-fit dominates it -- plus test_harmonics.py 17 s)
    #   (b1) 2 heavy FEM modules    9 tests    431 s MEASURED (test_fem_drivers.py 173 s / 8 passed,
    #                                          test_graded_tensor_fem.py 258 s / 1 passed)
    #   (b2) test_shg_grating.py    7 tests   1428 s MEASURED / 7 passed -- but 230 CPU-min and a
    #                                          26.5 GB private / 63.8 GB peak-working-set profile,
    #                                          i.e. it finished in 24 min only because that box has
    #                                          the cores and the RAM. See the step's own comment.
    #   (c1) 4 heavy FEM oracles               NOT re-measured here; the wave-3 probe that kept
    #                                          them out of the `solvers` leg put EACH over 180 s,
    #                                          so >= 12 min there and more on a runner
    #   (c2) run_all --tier full   204 gated validations + 7 examples: the aggregate is NOT
    #        MEASURED and cannot be cheaply bounded. 93 of the 204 are the SMOKE subset (each
    #        measured < 60 s by construction, a few minutes in total); the OTHER 111 are the
    #        solver/FDTD-backed oracles, individually unmeasured, against a per-script cap of
    #        1800 s. The runner's own docstring estimates this tier at "hours".
    # (a)+(b) therefore MEASURE 43 min on the workstation, and (b2) alone is 230 CPU-min -- on 4
    # vCPU that is an hour of wall by itself, so a runner plausibly spends 1.5-2 h reaching (c2).
    # 300 is a CAP, not a budget, and it is a guess about (c2); GitHub's hard ceiling for one job
    # is 6 h, so if the first real nightly run overruns this, the answer is NOT to nudge the number
    # toward 360: split (c2) by token across several jobs so each piece keeps a meaningful cap, and
    # record the measured aggregate here.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Same interpreter as the `solvers` job, for the same reason: 3.12 is the version the
          # ngsolve/devsim wheel set and this test selection were verified against locally.
          python-version: "3.12"
      - name: System libs (gmsh needs libGLU; devsim dlopens BLAS/LAPACK)
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libopenblas-dev liblapack-dev
      - name: Install (core + dev + plot + solvers + io backends + jax)
        # A SUPERSET of every PR leg's install: [solvers] for the FEM/DEVSIM work, h5py AND zarr
        # so both IO backends are live at once (the `test` legs each get only one), and jax so the
        # differentiable backends and the jax-FDTD validations run instead of exit-42-ing.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plot,solvers]" "h5py>=3.8" "zarr>=3" "jax>=0.11"
      - name: Assert the whole optional stack really imported
        # Same trip-wire logic as the other legs: a silently-partial install would turn most of
        # this job into skips, and in the non-smoke tiers run_all treats a skip as informational.
        run: |
          python -c "import ngsolve, devsim, gmsh; print('ngsolve', ngsolve.__version__, '| devsim', devsim.__version__, '| gmsh ok')"
          python -c "import h5py, zarr, jax; print('h5py', h5py.__version__, '| zarr', zarr.__version__, '| jax', jax.__version__)"
      - name: (a) the @slow tests every PR leg deselects
        # The 9 `-m slow` tests (8 in test_soa.py, 1 in test_harmonics.py): the QD-SOA validation
        # wrappers, the multi-minute Innolume co-fit, and the blazed-grating FDTD deflection oracle.
        # `-m "not slow"` on the four `test` legs is what makes them cheap; this is the other half.
        # PARTIAL OVERLAP with (c2) is deliberate and is not pure duplication: seven of these are
        # thin wrappers around validation modules (c2) also runs, but only the pytest route puts
        # them under pyproject's `filterwarnings = ["error", ...]` policy -- a RuntimeWarning on a
        # default path fails here and is invisible to run_all's exit-code gate.
        run: pytest tests/ -q -m slow
      - name: (b1) the heavy FEM/solver modules the `solvers` job excludes
        # Two of the three modules named in that job's comment as too slow for the PR tier. KEEP
        # THIS IN SYNC WITH IT: a module dropped from the solvers leg for being slow belongs here
        # in the same commit, or it goes back to running nowhere. Both MEASURED green locally
        # 2026-07-26 (173 s / 8 passed and 258 s / 1 passed). The third module is the next step,
        # separated so that these two always get a verdict.
        if: ${{ !cancelled() }}
        run: |
          pytest -q -m "not slow" \
            tests/test_fem_drivers.py tests/test_graded_tensor_fem.py
      - name: (b2) test_shg_grating.py (the 3-D SHG grating cells)
        # ITS OWN STEP BECAUSE IT IS THE ONE ITEM HERE THAT MAY NOT FIT ON THE RUNNER, and that is
        # a MEASUREMENT, not a worry. Locally on 2026-07-26 it PASSED 7/7 in 1428 s -- while
        # burning 230 CPU-min (so ~10 cores in parallel) and peaking at 26.5 GB private commit /
        # 63.8 GB working set. A GitHub-hosted ubuntu runner is 4 vCPU and 16 GB: the CPU-min alone
        # is an hour of wall there, and the memory does not obviously fit. An earlier attempt on
        # the same box DID die -- killed at 1563 s having finished 6 of 7 tests -- while two other
        # pytest sessions shared the machine, which is exactly the memory-pressure signature.
        # The cost is concentrated in ONE test: at the 1563 s mark of the killed attempt the first
        # six -- including the square-cell twin -- had all completed, and the survivor in flight was
        # test_spol_suppressed_vs_ppol[2.7e-07-1.9e-07], the RECTANGULAR (270 x 190 nm) 3-D
        # vectorial FEM cell. (Per-test durations were not recorded; that is the evidence there is.)
        # DECISION (2026-07-26, pre-first-nightly): remedy (i) applied UP FRONT -- 63.8 GB peak
        # working set cannot fit a 16 GB runner, so shipping the full file would be a guaranteed
        # capacity red misread as physics. The rectangular-cell parametrization is deselected here
        # and recorded in the not-covered list at the top of this file; it stays covered on the
        # dev workstation (run tests/test_shg_grating.py locally, 7/7 in ~24 min). Revisit with a
        # larger runner (remedy (ii)) if one becomes available. NOT `continue-on-error`: an
        # ignored red is the exact green-washing audit T-3 was about.
        if: ${{ !cancelled() }}
        run: pytest -q -m "not slow" tests/test_shg_grating.py -k "not (2.7e-07 and 1.9e-07)"
      - name: (c1) the four heavy FEM validation oracles, by name
        # Exactly the four the `solvers` job names and cannot afford (> 180 s each). These tokens
        # select 4 of the 204 gated scripts and nothing else (verified by substring 2026-07-26).
        # This step is a strict SUBSET of (c2) below and runs FIRST on purpose: if the full tier
        # overruns the job cap, these four still have a verdict.
        if: ${{ !cancelled() }}
        run: |
          python -m validation.run_all \
            superstrate_index_fem graded_tmm_vs_fem per_region_absorption symmetry_reduced_fem
      - name: (c2) the full validation tier
        # run_all defines exactly two tiers, `smoke` and `full` (there is no separate "heavy"
        # one), so this -- 204 gated validations + the 7 exit-gated examples/ workflows -- is the
        # invocation that reaches the 111 non-smoke oracles no other leg can. NO --allow-skip:
        # outside the smoke tier an exit-42 is informational BY CONTRACT (that strictness is the
        # smoke tier's alone), and with the install above exactly two scripts should take it --
        # fdtd_numba_cuda (no GPU on this runner) and qd_soa_numba_parity (numba is deliberately
        # NOT installed here; the dedicated `numba` job runs that oracle for real on Windows).
        # Runs LAST because it is the one step whose wall-clock is not bounded by measurement.
        if: ${{ !cancelled() }}
        run: python -m validation.run_all --tier full
